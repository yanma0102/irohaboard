<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html/webroot

	# base_path（URLのサブディレクトリ接頭辞）付きの静的ファイルを解決する。
	# 例: /iroha1/css/app.css -> /css/app.css, /iroha1/favicon.ico -> /favicon.ico
	# 「静的ディレクトリ配下」または「ルート直下の拡張子付き静的ファイル」に限り、
	# 先頭の接頭辞を1段だけ剥がす。実際にファイルが存在する場合のみ書き換えるため、
	# 動的ルートや、サブディレクトリに実設置済みの構成には影響しない。
	RewriteEngine On
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_URI} ^/[^/]+/((?:css|js|img|fonts|uploads|files)/.+|[^/]+\.(?:ico|png|gif|jpe?g|svg|webp|bmp|css|js|map|woff2?|ttf|eot|otf|txt|xml|json|webmanifest|pdf|zip|mp4|mov|webm))$
	RewriteCond %{DOCUMENT_ROOT}/%1 -f
	RewriteRule ^/[^/]+/(.*)$ /$1 [L]

	<Directory /var/www/html/webroot>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# セキュリティヘッダー
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>