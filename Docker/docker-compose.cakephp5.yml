name: irohaboard5

services:
  web:
    # 公開イメージ（Docker Hub）。`docker compose pull web` で取得、
    # `--build` でこのリポジトリの Dockerfile からローカルビルド。
    image: yanma0102/irohaboard:latest
    build:
      context: ../
      dockerfile: Docker/Dockerfile.cakephp5
    ports:
      - "8082:80"
    volumes:
      # 開発時のホットリロード用にアプリケーションコードをマウント
      - ../app:/var/www/html/
      # tmpディレクトリの永続化（コンテナ再起動時も保持）
      - cakephp5-tmp:/var/www/html/tmp
      # アップロードファイルの永続化
      - cakephp5-files:/var/www/html/files
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=irohaboard
      - DB_USER=root
      - DB_PASS=rootpass
      - APP_FULL_BASE_URL=http://localhost:8082
      # debug=false に固定する。debug=true のままだと DebugKit が常時起動し、
      # 画面右下のツールバーが画面のリロードごとに大量の AJAX を発行するため
      # 体感速度が大幅に低下する。開発時はこの行を true に変更すること。
      - DEBUG=false
      # MCP の Host/Origin ヘッダ許可リスト（カンマ区切り）。
      # 本番ではサーバの IP / ホスト名を追加しないと MCP が 403 になる。
      # 例: MCP_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],192.168.20.161
      # 未設定なら localhost 系のみ許可。
      - MCP_ALLOWED_HOSTS=
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 512
    restart: unless-stopped
    # アップロード先の所有権調整（www-data への chown）は
    # イメージの ENTRYPOINT（Docker/entrypoint.sh）が起動時に実行する。

  db:
    image: mariadb:11.4
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: irohaboard
      MYSQL_USER: ib_user
      MYSQL_PASSWORD: ib_password
    volumes:
      - cakephp5-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

volumes:
  cakephp5-mysql-data:
  cakephp5-tmp:
  cakephp5-files: