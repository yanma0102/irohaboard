name: irohaboard5-hub

# Docker Hub の公開イメージ（yanma0102/irohaboard:latest）を使って起動する構成。
# このイメージはアプリ本体を含まない Web ランタイムのため、リポジトリの app/ を
# /var/www/html にマウントして供給する（マウント方式）。
#   docker compose -f Docker/docker-compose.hub.yml pull
#   docker compose -f Docker/docker-compose.hub.yml up -d
services:
  web:
    image: yanma0102/irohaboard:latest
    ports:
      - "8082:80"
    volumes:
      # アプリ本体はリポジトリからマウント供給
      - ../app:/var/www/html/
      # tmpディレクトリの永続化（コンテナ再起動時も保持）
      - cakephp5-tmp:/var/www/html/tmp
      # アップロードファイルの永続化
      - cakephp5-files:/var/www/html/files
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=irohaboard
      - DB_USER=root
      - DB_PASS=rootpass
      - APP_FULL_BASE_URL=http://localhost:8082
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 512
    restart: unless-stopped
    # アップロード先の所有権を Apache 実行ユーザ www-data に合わせる。
    # webroot/uploads はホスト bind、files/tmp は named volume のため、起動時に毎回 chown する。
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/webroot/uploads /var/www/html/files /var/www/html/tmp &&
      exec apache2-foreground"

  db:
    image: mariadb:11.4
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: irohaboard
      MYSQL_USER: ib_user
      MYSQL_PASSWORD: ib_password
    volumes:
      - cakephp5-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

volumes:
  cakephp5-mysql-data:
  cakephp5-tmp:
  cakephp5-files:
