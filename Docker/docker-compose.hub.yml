name: irohaboard5-hub

# Docker Hub の公開イメージ（yanma0102/irohaboard:latest）を使って起動する構成。
# アプリ本体（vendor 同梱）はイメージに含まれるため、リポジトリの clone や
# composer install は不要。pull だけで起動できる（オフライン環境向け）。
#   docker compose -f Docker/docker-compose.hub.yml pull
#   docker compose -f Docker/docker-compose.hub.yml up -d
services:
  web:
    image: yanma0102/irohaboard:latest
    ports:
      - "8082:80"
    volumes:
      # tmpディレクトリの永続化（コンテナ再起動時も保持）
      - cakephp5-tmp:/var/www/html/tmp
      # アップロードファイルの永続化
      - cakephp5-files:/var/www/html/files
      # 画像アップロード（webroot/uploads）の永続化
      - cakephp5-uploads:/var/www/html/webroot/uploads
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=irohaboard
      - DB_USER=root
      - DB_PASS=rootpass
      - APP_FULL_BASE_URL=http://localhost:8082
      # 本番想定: DebugKit を無効化して画面遷移を高速化する
      - DEBUG=false
      # MCP の Host/Origin ヘッダ許可リスト（カンマ区切り）。
      # 本番ではサーバの IP / ホスト名を追加しないと MCP が 403 になる。
      # 例: MCP_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],192.168.20.161
      # 未設定なら localhost 系のみ許可。
      - MCP_ALLOWED_HOSTS=
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 512
    restart: unless-stopped

  db:
    image: mariadb:11.4
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: irohaboard
      MYSQL_USER: ib_user
      MYSQL_PASSWORD: ib_password
    volumes:
      - cakephp5-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

volumes:
  cakephp5-mysql-data:
  cakephp5-tmp:
  cakephp5-files:
  cakephp5-uploads:
