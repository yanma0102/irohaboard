; iroha Board用PHP設定
[PHP]
; エラー表示設定（開発環境用）
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
; Request Startup 時の警告（本文サイズ超過など）をバッファに留めておく。
; これを有効にしないと警告が即座に送信され、HTTP ステータスを送出できなくなる（D-42）。
output_buffering = 4096

; 文字エンコーディング
default_charset = "UTF-8"

; 日本時間
date.timezone = Asia/Tokyo

; ファイルアップロード設定
; upload_max_filesize / post_max_size は設定画面の「アップロード上限」の最大値
; （1024MB）と一致させておく。php.ini 側が小さいと設定値が実効しない。
upload_max_filesize = 1024M
post_max_size = 1024M
max_execution_time = 60
; max_input_time はファイル受信時間も含むため、大容量動画のアップロードを許可するには
; post_max_size の引き上げに併せて引き上げる必要がある。
max_input_time = 3600
memory_limit = 256M

; セッション設定
session.gc_maxlifetime = 1440

; OPcache設定
; 有効化することで毎リクエストのPHP再コンパイルを避け、画面遷移が大幅に高速化する。
; ソースはイメージに焼き込まれるため本番では再読込不要だが、開発時のバインドマウント
; でも変更が反映されるよう validate_timestamps は有効にしておく。
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; mbstring設定
mbstring.language = Japanese
