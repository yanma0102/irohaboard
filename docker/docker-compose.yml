services:
  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8081:80"
    volumes:
      # 開発時のホットリロード用にアプリケーションコードをマウント
      - ../:/var/www/html/app/
      # tmpディレクトリの永続化（コンテナ再起動時も保持）
      - cakephp-tmp:/var/www/html/app/tmp
      # アップロードファイルの永続化
      - cakephp-files:/var/www/html/app/files
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=irohaboard
      - DB_USER=root
      - DB_PASS=rootpass
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: irohaboard
      MYSQL_USER: ib_user
      MYSQL_PASSWORD: ib_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
  cakephp-tmp:
  cakephp-files:
