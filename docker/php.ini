; iroha Board用PHP設定
[PHP]
; エラー表示設定（開発環境用）
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; 文字エンコーディング
default_charset = "UTF-8"

; 日本時間
date.timezone = Asia/Tokyo

; ファイルアップロード設定
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 300
memory_limit = 256M

; セッション設定
session.gc_maxlifetime = 1440

; OPcache設定（開発環境では無効化推奨）
opcache.enable = 0

; mbstring設定
mbstring.language = Japanese
